server {
    server_name tools.parentdataforce.org;
    root /var/www/parentdataforce/tools;
    index index.html;
    access_log /var/log/nginx/parentdataforce-tools.access.log;
    error_log /var/log/nginx/parentdataforce-tools.error.log;
    # Spider protection — do NOT index this site yet
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Serve the tools-site robots.txt (Disallow: /) instead of Node's shared public one
    location = /robots.txt {
        root /var/www/parentdataforce/tools;
    }

    # Hub + everything else served from Node's public dir (same app as dev)
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location = /tools { return 301 /tools/; }
    location /tools/ {
        proxy_pass http://127.0.0.1:3101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Root-level static assets served from Node's public dir
    location ~ ^/(styles\.css|logo\.png|app\.js|ads\.js|sig-badge\.svg)$ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Articles + SEO files (served from Node's public dir)
    location ~ ^/(articles|robots\.txt|sitemap\.xml) {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Node API routes (QR + YouTube transcript + info)
    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Docling Lab API (AI conversion + forensics) — long jobs, larger uploads
    # Rate limited: public API, 3 req/min per IP with burst 2 (see conf.d/docling-rate-limit.conf)
    # Cheap endpoints — health checks + job-status polling (UI + watchdog).
    # NOT rate limited: polling loops would otherwise trip the 3r/m limit.
    location /api/docling/health {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 70m;
    }

    location /api/docling/job/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 70m;
    }

    # Quota status — lightweight, UI reads it on page load; NOT rate limited.
    location = /api/docling/quota {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /api/docling/ {
        limit_req zone=docling burst=2 nodelay;
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 70m;
    }

    # QR redirect links — public, no auth
    location /r/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Client-side PDF tools
    location /tools/pdf/ {
        proxy_pass http://127.0.0.1:3101/tools/pdf/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # QR Studio (accounts + dashboard)
    location /tools/qr/ {
        proxy_pass http://127.0.0.1:3101/tools/qr/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Email / Link Tracker
    location /tools/email/ {
        proxy_pass http://127.0.0.1:3101/tools/email/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # YouTube transcript tool
    location /tools/youtube/ {
        proxy_pass http://127.0.0.1:3101/tools/youtube/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # PDF redaction tool
    location /tools/redact/ {
        proxy_pass http://127.0.0.1:3101/tools/redact/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Docling Lab (AI conversion + forensics)
    location /tools/docling/ {
        proxy_pass http://127.0.0.1:3101/tools/docling/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tools.parentdataforce.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tools.parentdataforce.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = tools.parentdataforce.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name tools.parentdataforce.org;
    listen 80;
    return 404; # managed by Certbot


}